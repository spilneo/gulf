[project]
name = "gulf-opt-in-e2e"
rust_version = "1.96"
edition = "2024"

[developer]
default_commission_bps = 20

[developer.recipients]
evm = "${env.GULF_E2E_EVM_FEE_RECIPIENT}"

[developer.b2b]
enabled = true
default_partner_fee_bps = 0
max_partner_fee_bps = 50
require_partner_recipient = false
settlement = "test_only_no_settlement"

[safety]
max_commission_bps = 100
require_live_quote_for_swap = true

[routing]
sort = ["total_configured_bps", "settlement_seconds", "provider_name"]
require_chain_registry_match = true
require_token_registry_match = false

[server]
default_listen = "127.0.0.1:18081"

