[[providers]]
id = "circle-cctp-sandbox-fees"
name = "Circle CCTP Sandbox Fees"
enabled = true
service_type = "contract_only"
supported_chains = ["eip155:11155111", "eip155:84532"]
docs = ["https://developers.circle.com/cctp/howtos/get-transfer-fee", "https://developers.circle.com/cctp/concepts/supported-chains-and-domains", "https://developers.circle.com/cctp/concepts/forwarding-service"]
notes = "No-signature e2e probe for Circle sandbox fee quote from Ethereum Sepolia domain 0 to Base Sepolia domain 6. CCTP V2 prepare returns EVM calldata with approval + burn actions. Uses depositForBurnWithHook (CCTP V2 Forwarding Service) so destination Base Sepolia gas is not required."
fee = { unit = "bps", dynamic = true, estimated_bps = 1, settlement_seconds = 20, notes = "Sandbox returns route fee rows by finality threshold." }
commission = { supported = false, strategy = "none", default_bps = 0, max_bps = 0 }

[providers.http]
base_url = "https://iris-api-sandbox.circle.com"
default_headers = { Accept = "application/json" }

[providers.http.requests.quote]
method = "GET"
path = "/v2/burn/USDC/fees/${from_chain.provider.circle}/${to_chain.provider.circle}?forward=true"
timeout_ms = 10000
retry_attempts = 2
response = { estimated_fee_bps = "0.minimumFee" }

