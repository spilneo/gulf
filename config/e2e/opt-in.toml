[[providers]]
id = "changenow"
name = "ChangeNOW"
enabled = true
service_type = "meta_aggregator"
supported_chains = ["bip122:000000000019d6689c085ae165831e93", "eip155:1"]
supported_tokens = ["bitcoin-btc", "ethereum-eth"]
docs = ["https://changenow.io/blog/best-crypto-bridges"]
notes = "Opt-in centralized-exchange deposit probe. Gated on GULF_CHANGENOW_ENABLED=true and non-empty GULF_CHANGENOW_API_KEY. Prepare returns centralized_deposit with exchange id/deposit address. No funds are broadcast."
fee = { unit = "bps", dynamic = true, estimated_bps = 40, settlement_seconds = 900 }
commission = { supported = true, strategy = "partner_revenue_share", default_bps = 20, max_bps = 100 }

[providers.http]
base_url = "https://api.changenow.io/v2"
default_headers = { Accept = "application/json", "Content-Type" = "application/json" }
auth = { headers = { "x-changenow-api-key" = "${env.GULF_CHANGENOW_API_KEY}" } }

[providers.http.requests.quote]
method = "GET"
path = "/exchange/estimated-amount"
query = { fromCurrency = "${from_token.provider.changenow}", toCurrency = "${to_token.provider.changenow}", fromNetwork = "${from_chain.provider.changenow}", toNetwork = "${to_chain.provider.changenow}", fromAmount = "${amount.decimal}" }
timeout_ms = 15000
retry_attempts = 1
response = { output_amount = "toAmount" }

[providers.http.requests.prepare]
method = "POST"
path = "/exchange"
body_json = { fromCurrency = "${from_token.provider.changenow}", toCurrency = "${to_token.provider.changenow}", fromNetwork = "${from_chain.provider.changenow}", toNetwork = "${to_chain.provider.changenow}", fromAmount = "${amount.decimal}", address = "${recipient}", refundAddress = "${sender}", flow = "standard" }
timeout_ms = 15000
retry_attempts = 1
response = { execution_kind = "centralized_deposit", output_amount = "expectedAmount", deposit_address = "payinAddress", memo = "payinExtraId", expires_at = "validUntil", status_id = "id" }
