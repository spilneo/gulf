[[providers]]
id = "across-swap-api-testnet"
name = "Across Swap API Testnet"
enabled = true
service_type = "direct_bridge"
supported_chains = ["eip155:11155111", "eip155:84532"]
docs = ["https://docs.across.to/introduction/swap-api"]
notes = "Opt-in e2e probe against the Across testnet Swap API. Testnet requests are public; production requests require GULF_ACROSS_API_KEY and GULF_ACROSS_INTEGRATOR_ID."
fee = { unit = "bps", dynamic = true, estimated_bps = 4, settlement_seconds = 60, notes = "Testnet quote; production fees vary by route and liquidity." }
commission = { supported = true, strategy = "app_fee_decimal", default_bps = 20, max_bps = 100, parameters = { appFee = "${revenue.total_decimal}", appFeeRecipient = "${developer.evm_recipient}" } }

[providers.http]
base_url = "https://testnet.across.to/api"
default_headers = { Accept = "application/json" }

[providers.http.requests.quote]
method = "GET"
