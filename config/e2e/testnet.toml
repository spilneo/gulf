[project]
name = "gulf-e2e"
rust_version = "1.96"
edition = "2024"

[developer]
default_commission_bps = 0

[developer.recipients]
evm = "0xd8dA6BF26964aF9D7eEd9e03E53415D37aA96045"

[safety]
max_commission_bps = 0
require_live_quote_for_swap = true

[routing]
sort = ["total_configured_bps", "settlement_seconds", "provider_name"]
require_chain_registry_match = true
require_token_registry_match = false

[server]
default_listen = "127.0.0.1:18080"

[e2e]
rpc_probes = [
  { chain = "eip155:11155111", expected_chain_id = "0xaa36a7" },
  { chain = "eip155:84532", expected_chain_id = "0x14a34" },
  { chain = "eip155:11142220", expected_chain_id = "0xaa044c" },
]

[[e2e.quote_probes]]
name = "circle-cctp-sandbox-fee-sepolia-to-base-sepolia"
expected_provider = "circle-cctp-sandbox-fees"
from_chain = "eip155:11155111"
to_chain = "eip155:84532"
from_token = "USDC"
to_token = "USDC"
amount = "1000000"
sender = "0xd8dA6BF26964aF9D7eEd9e03E53415D37aA96045"
live = true

[[e2e.prepare_probes]]
name = "circle-cctp-sandbox-prepare-sepolia-to-base-sepolia"
expected_provider = "circle-cctp-sandbox-fees"
from_chain = "eip155:11155111"
to_chain = "eip155:84532"
from_token = "USDC"
to_token = "USDC"
amount = "1000000"
sender = "0xd8dA6BF26964aF9D7eEd9e03E53415D37aA96045"
live = true

