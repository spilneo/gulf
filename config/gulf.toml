# -----------------------------------------------------------------------
# Allbridge: local REST API
# - allbridge-pool: ALLBRIDGE messenger (pool-based bridge)
# - allbridge-cctp-oft: CCTP messenger (OFT not available on Base->Arbitrum)
# The API must already be running at http://127.0.0.1:3000.
# -----------------------------------------------------------------------

[[providers]]
id = "allbridge-pool"
name = "Allbridge Pool (ALLBRIDGE messenger)"
enabled = true
service_type = "direct_bridge"
supported_chains = ["eip155:42161", "eip155:8453", "eip155:1", "eip155:10", "eip155:56", "eip155:43114"]
docs = ["https://docs-core.allbridge.io/sdk/get-started", "https://github.com/allbridge-public/allbridge-core-rest-api"]
notes = "Allbridge pool-based bridge via local REST API (ALLBRIDGE messenger). The API must already be running at the configured URL. Minimum quote ~500k units."
fee = { unit = "bps", dynamic = true, estimated_bps = 15, settlement_seconds = 60, notes = "LP fee (0.15% source + 0.15% dst) via ALLBRIDGE messenger." }
commission = { supported = false, strategy = "none", default_bps = 0, max_bps = 0 }

[providers.http]
base_url = "http://127.0.0.1:3000"

[providers.http.requests.quote]
method = "GET"
path = "/bridge/quote"
query = { amount = "${amount.raw}", sourceToken = "${from_token.provider.allbridge}", destinationToken = "${to_token.provider.allbridge}" }
timeout_ms = 30000
retry_attempts = 1
response = { output_amount = "options.0.paymentMethods.0.estimatedAmount.min", error = "message", status_id = "options.0.messenger" }

[providers.http.requests.prepare]
method = "GET"
path = "/raw/bridge"
query = { amount = "${amount.raw}", sender = "${sender}", recipient = "${recipient}", sourceToken = "${from_token.provider.allbridge}", destinationToken = "${to_token.provider.allbridge}", messenger = "ALLBRIDGE", feePaymentMethod = "WITH_NATIVE_CURRENCY" }
timeout_ms = 30000
retry_attempts = 1
response = { transaction_to = "to", transaction_data = "data", transaction_value = "value" }

[[providers]]
id = "allbridge-cctp-oft"
name = "Allbridge CCTP (CCTP messenger)"
enabled = true
service_type = "direct_bridge"
supported_chains = ["eip155:42161", "eip155:8453", "eip155:1", "eip155:10", "eip155:56", "eip155:43114"]
