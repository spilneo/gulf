[[providers]]
id = "circle-cctp-standard"
name = "Circle CCTP Standard"
enabled = true
service_type = "contract_only"
supported_chains = ["eip155:42161", "eip155:43114", "eip155:8453", "eip155:1", "eip155:59144", "eip155:10", "eip155:137", "solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp", "eip155:130"]
docs = ["https://developers.circle.com/cctp/concepts/fees", "https://developers.circle.com/cctp/howtos/get-transfer-fee"]
notes = "Standard CCTP has no protocol fee, but it has finality latency and no native affiliate field."
fee = { unit = "bps", dynamic = true, estimated_bps = 0, settlement_seconds = 900, notes = "Standard transfer fee is documented as 0 bps; chain gas still applies." }
commission = { supported = false, strategy = "wrapper_contract", default_bps = 0, max_bps = 0, notes = "Use an application wrapper before depositForBurn if monetization is required." }

[providers.http]
base_url = "https://iris-api.circle.com"

[providers.http.requests.quote]
method = "GET"
path = "/v2/burn/USDC/fees/${from_chain.provider.circle}/${to_chain.provider.circle}"
response = { estimated_fee_bps = "1.minimumFee" }

[[providers]]
id = "openocean-v4"
name = "OpenOcean V4"
enabled = true
service_type = "dex_aggregator"
supported_chains = ["eip155:1", "eip155:42161", "eip155:43114", "eip155:8453", "eip155:56", "eip155:10", "eip155:137", "solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp", "tron:mainnet"]
docs = ["https://marketplace.quicknode.com/add-on/openocean-v4-swap-api", "https://blog.openocean.finance/openocean-api-3-0-the-most-efficient-api-tool-for-your-crypto-trading-dfafde8d8274"]
notes = "Same-chain DEX aggregation fallback; bridge routes should prefer bridge-capable providers. The initial HTTP mapping uses gasPriceDecimals=1000000000 (1 gwei) because Gulf does not yet preflight OpenOcean gasPrice dynamically. Per OpenOcean docs: /swap uses 'account' as recipient/receiver and 'sender' as caller; when they are the same, self-recipient limitation applies."
fee = { unit = "bps", dynamic = true, estimated_bps = 0, settlement_seconds = 20, notes = "No protocol fee advertised; route price impact and gas apply." }
commission = { supported = true, strategy = "partner_referral", default_bps = 20, max_bps = 300, notes = "Partner/referral setup is handled by OpenOcean commercial/API configuration." }

[providers.http]
base_url = "https://open-api.openocean.finance"
default_headers = { Accept = "application/json", "User-Agent" = "gulf/0.1" }

[providers.http.requests.quote]
method = "GET"
path = "/v4/${from_chain.numeric_chain_id}/quote"
query = { inTokenAddress = "${from_token.address}", outTokenAddress = "${to_token.address}", amountDecimals = "${amount.raw}", gasPriceDecimals = "1000000000", slippage = "0.5" }
timeout_ms = 15000
retry_attempts = 1
response = { output_amount = "data.outAmount", transaction_to = "data.to", transaction_data = "data.data", transaction_value = "data.value" }

[providers.http.requests.prepare]
method = "GET"
path = "/v4/${from_chain.numeric_chain_id}/swap"
query = { inTokenAddress = "${from_token.address}", outTokenAddress = "${to_token.address}", amountDecimals = "${amount.raw}", gasPriceDecimals = "1000000000", slippage = "0.5", account = "${recipient}", sender = "${sender}", referrer = "${developer.evm_recipient}" }
timeout_ms = 15000
retry_attempts = 1
response = { output_amount = "data.outAmount", transaction_to = "data.to", transaction_data = "data.data", transaction_value = "data.value", erc20_approval_spender = "data.to" }

[[providers]]
id = "odos"
name = "Odos"
enabled = true
service_type = "dex_aggregator"
supported_chains = ["eip155:1", "eip155:42161", "eip155:43114", "eip155:8453", "eip155:56", "eip155:10", "eip155:137"]
docs = ["https://docs.odos.xyz/"]
notes = "Same-chain multi-hop DEX aggregation; keep separate from cross-chain bridge routes."
fee = { unit = "bps", dynamic = true, estimated_bps = 0, settlement_seconds = 20, notes = "No platform fee in common routing; gas and price impact apply." }
commission = { supported = true, strategy = "partner_referral", default_bps = 20, max_bps = 300, notes = "Use Odos partner/referral setup where enabled for the integrator account." }

[providers.http]
base_url = "https://api.odos.xyz"
default_headers = { Accept = "application/json", "Content-Type" = "application/json", "x-api-key" = "${env.GULF_ODOS_API_KEY}" }
prepare_flow = { steps = ["quote", "assemble"] }

[providers.http.requests.quote]
method = "POST"
path = "/sor/quote/v3"
body_json = { chainId = "${from_chain.numeric_chain_id}", inputTokens = [{ tokenAddress = "${from_token.address}", amount = "${amount.raw}" }], outputTokens = [{ tokenAddress = "${to_token.address}", proportion = 1 }], slippageLimitPercent = 0.5, userAddr = "${sender}" }
timeout_ms = 20000
retry_attempts = 1
response = { output_amount = "outAmounts.0", gas_fee_usd = "gasEstimateValue", transaction_to = "transaction.to", transaction_data = "transaction.data", transaction_value = "transaction.value" }

[providers.http.requests.assemble]
method = "POST"
path = "/sor/assemble"
body_json = { userAddr = "${sender}", pathId = "${step.quote.pathId}", simulate = true, receiver = "${recipient}" }
timeout_ms = 30000
retry_attempts = 1
response = { output_amount = "result.outputTokens.0.amount", gas_fee_usd = "result.gasEstimateValue", transaction_to = "result.transaction.to", transaction_data = "result.transaction.data", transaction_value = "result.transaction.value", erc20_approval_spender = "result.transaction.to", erc20_approval_amount = "result.inputTokens.0.amount" }

