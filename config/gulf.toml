commission = { supported = false, strategy = "none", default_bps = 0, max_bps = 0 }

[providers.http]
base_url = "http://127.0.0.1:3000"

[providers.http.requests.quote]
method = "GET"
path = "/bridge/quote"
query = { amount = "${amount.raw}", sourceToken = "${from_token.provider.allbridge}", destinationToken = "${to_token.provider.allbridge}" }
timeout_ms = 30000
retry_attempts = 1
response = { output_amount = "options.1.paymentMethods.0.estimatedAmount.min", error = "message", status_id = "options.1.messenger" }

[providers.http.requests.prepare]
method = "GET"
path = "/raw/bridge"
query = { amount = "${amount.raw}", sender = "${sender}", recipient = "${recipient}", sourceToken = "${from_token.provider.allbridge}", destinationToken = "${to_token.provider.allbridge}", messenger = "CCTP", feePaymentMethod = "WITH_NATIVE_CURRENCY" }
