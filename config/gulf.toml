# -----------------------------------------------------------------------
# Eco Routes: no-auth intent-based cross-chain quoting
# Uses SELF_PUBLISH intent execution (typed_signature_request).
# No API key, no auth headers. dAppID from GULF_ECO_DAPP_ID.
# -----------------------------------------------------------------------

[[providers]]
id = "eco-routes"
name = "Eco Routes"
enabled = true
service_type = "direct_bridge"
supported_chains = ["eip155:42161", "eip155:8453", "eip155:1", "eip155:10"]
docs = ["https://docs.eco.com/api-reference/introduction"]
notes = "Eco ERC-7683 intent-based cross-chain quoting. No auth required. Uses SELF_PUBLISH intent execution type (no EVM tx unless calldata returned). dAppID in body for attribution: GULF_ECO_DAPP_ID."
fee = { unit = "bps", dynamic = true, estimated_bps = 10, settlement_seconds = 120, notes = "Intent relay fees vary by solver, route, and liquidity." }
commission = { supported = false, strategy = "none", default_bps = 0, max_bps = 0 }

[providers.http]
base_url = "https://quotes.eco.com"

[providers.http.requests.quote]
method = "POST"
path = "/api/v3/quotes/exactIn"
body_json = { dAppID = "${env.GULF_ECO_DAPP_ID}", intentExecutionTypes = ["SELF_PUBLISH"], quoteRequest = { sourceChainID = "${from_chain.numeric_chain_id}", destinationChainID = "${to_chain.numeric_chain_id}", sourceToken = "${from_token.address}", destinationToken = "${to_token.address}", sourceAmount = "${amount.raw}", funder = "${sender}", recipient = "${recipient}", refundRecipient = "${sender}" } }
timeout_ms = 30000
retry_attempts = 1
response = { output_amount = "data.0.quoteData.quoteResponse.destinationAmount", error = "message", status_id = "data.0.quoteID" }

[providers.http.requests.prepare]
method = "POST"
path = "/api/v3/quotes/exactIn"
body_json = { dAppID = "${env.GULF_ECO_DAPP_ID}", intentExecutionTypes = ["SELF_PUBLISH"], quoteRequest = { sourceChainID = "${from_chain.numeric_chain_id}", destinationChainID = "${to_chain.numeric_chain_id}", sourceToken = "${from_token.address}", destinationToken = "${to_token.address}", sourceAmount = "${amount.raw}", funder = "${sender}", recipient = "${recipient}", refundRecipient = "${sender}" } }
timeout_ms = 30000
retry_attempts = 1
response = { output_amount = "data.0.quoteData.quoteResponse.destinationAmount", intent_status_url = "data.0.receiveSignedIntentUrl", solver_id = "data.0.solverID", status_id = "data.0.quoteID" }
